<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0B2F45">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; script-src-attr 'none'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com https://www.gstatic.com; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<title>Shiva Sathvika Home Bookings</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Bookings">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="staff.css?v=9">
</head>
<body>

<!-- SIGN IN -->
<main id="login" class="gate">
  <form class="login" id="loginForm" autocomplete="off">
    <div class="mark"><img src="images/ss-logo.png" alt="Shiva Sathvika logo" width="68" height="78"></div>
    <h1>Shiva Sathvika Home Bookings</h1>
    <p>Staff sign in</p>
    <label class="f" for="who">Who are you?</label>
    <select id="who" class="in">
      <option value="admin">Admin</option>
      <option value="u1">Technician 1</option>
      <option value="u2">Technician 2</option>
    </select>
    <label class="f" for="pin">PIN</label>
    <input id="pin" class="in pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="30">
    <p class="err" id="lerr" role="alert"></p>
    <button id="go" class="btn main full" type="submit" style="margin-top:6px;min-height:52px">Sign in</button>
    <div id="inst" class="inst" hidden>
      <button id="instBtn" class="instbtn" type="button" hidden>Install app on this phone</button>
      <p id="instHelp" class="insthelp"></p>
    </div>
  </form>
</main>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div class="hwrap">
      <div class="hrow">
        <div><b id="hname"></b><small id="hrole"></small></div>
        <div class="hbtns">
          <button id="dev" class="ibtn" type="button" aria-label="Approve phones" hidden></button>
          <button id="ref" class="ibtn" type="button" aria-label="Refresh"></button>
          <button id="out" class="ibtn" type="button" aria-label="Log out"></button>
        </div>
      </div>
      <div class="seg" role="tablist" aria-label="Day">
        <button id="t0" role="tab" class="on" aria-selected="true" type="button">Today <i id="n0">0</i></button>
        <button id="t1" role="tab" aria-selected="false" type="button">Tomorrow <i id="n1">0</i></button>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div id="alertBar" class="alertbar" hidden><span>Get an alert on this phone for new bookings</span><button id="alertBtn" type="button">Turn on</button></div>
    <button id="add" class="btn main full addp" type="button">+ New patient</button>
    <div id="chips" class="chips" role="group" aria-label="Filter by status"></div>
    <div class="find">
      <label class="sr" for="q">Search</label>
      <input id="q" class="in" type="search" placeholder="Search name, phone or no." autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div id="list" aria-live="polite"></div>
  </div>
</div>

<div id="veil" class="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="staff.js?v=9"></script>
</body>
</html>
